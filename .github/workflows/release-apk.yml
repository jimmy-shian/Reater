name: Build and release APK
run-name: Reater ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-ci-test-*'

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate version tag and signing configuration
        shell: bash
        env:
          REATER_KEYSTORE_BASE64: ${{ secrets.REATER_KEYSTORE_BASE64 }}
          REATER_KEY_ALIAS: ${{ secrets.REATER_KEY_ALIAS }}
          REATER_STORE_PASS: ${{ secrets.REATER_STORE_PASS }}
          REATER_KEY_PASS: ${{ secrets.REATER_KEY_PASS }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          source = pathlib.Path('app/build.gradle.kts').read_text(encoding='utf-8')
          version = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', source, re.M).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}' and not re.fullmatch(re.escape(f'v{version}') + r'-ci-test-\d+', tag):
              raise SystemExit(f'Tag {tag} must match versionName v{version}')
          required = ('REATER_KEYSTORE_BASE64', 'REATER_KEY_ALIAS', 'REATER_STORE_PASS', 'REATER_KEY_PASS')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          PY

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Load release signing references
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_BASE64:?Missing KEYSTORE_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test and build release APK
        shell: bash
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain

      - name: Align, sign and verify APK
        shell: bash
        env:
          REATER_CERT_SHA256: b90cb6eee6caba3f431e1dd967a9170c19e6c572b5b57c745e357e358e180d5a
          REATER_KEYSTORE_BASE64: ${{ secrets.REATER_KEYSTORE_BASE64 }}
          REATER_KEY_ALIAS: ${{ secrets.REATER_KEY_ALIAS }}
          REATER_STORE_PASS: ${{ secrets.REATER_STORE_PASS }}
          REATER_KEY_PASS: ${{ secrets.REATER_KEY_PASS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Reater-${GITHUB_REF_NAME}.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "dist/Reater-${GITHUB_REF_NAME}.apk" > "$RUNNER_TEMP/reater-signature.txt"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'reater-signature.txt').read_text(encoding='utf-8')
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]+)$', output, re.M)
          if certificates != [os.environ['REATER_CERT_SHA256']]:
              raise SystemExit('APK signing certificate differs from the local release key')
          print('APK signature verified; certificate matches the local release key')
          PY
          (cd dist && sha256sum "Reater-${GITHUB_REF_NAME}.apk" > "Reater-${GITHUB_REF_NAME}.apk.sha256")

      - name: Upload APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reater-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-ci-test-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" \
              --title "Reater $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
